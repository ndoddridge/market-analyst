<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1c24" />
    <title>Market Analyst — My Positions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand-bar">
        <p class="brand">Market Analyst</p>
        <p class="brand-sub">My Positions</p>
      </header>

      <nav class="app-nav" aria-label="Primary">
        <a class="app-nav-link" href="/">Today</a>
        <a class="app-nav-link is-active" href="/positions">My Positions</a>
      </nav>

      <section class="positions-intro">
        <p>
          Upload a CSV or add positions manually. We’ll map each holding to the
          existing SHORT_TERM scanner evidence and recommend ADD, HOLD, REDUCE,
          SELL, or WATCH.
        </p>
      </section>

      <section class="positions-tools" aria-label="Load positions">
        <label class="file-btn">
          Upload CSV
          <input id="csv-input" type="file" accept=".csv,text/csv" hidden />
        </label>
        <button type="button" class="ghost-btn" id="toggle-manual">
          Add Position
        </button>
        <button type="button" class="ghost-btn" id="clear-positions" hidden>
          Clear
        </button>
      </section>

      <p class="csv-hint">
        CSV columns: <code>ticker,shares,avgCost,currentPrice</code>
      </p>

      <form id="manual-form" class="manual-form" hidden>
        <div class="manual-grid">
          <label>
            Ticker
            <input id="manual-ticker" name="ticker" autocomplete="off" />
          </label>
          <label>
            Shares
            <input id="manual-shares" name="shares" inputmode="decimal" />
          </label>
          <label>
            Avg cost
            <input id="manual-avg" name="avgCost" inputmode="decimal" />
          </label>
          <label>
            Current
            <input id="manual-price" name="currentPrice" inputmode="decimal" />
          </label>
        </div>
        <button type="submit" class="primary-btn">Save Position</button>
      </form>

      <section id="positions-status" class="status" aria-live="polite" hidden></section>

      <section id="portfolio-summary" class="portfolio-summary" hidden></section>

      <section id="recommended-actions" class="recommended-actions" hidden>
        <p class="section-label">Recommended Actions</p>
        <ol id="actions-list" class="actions-list"></ol>
      </section>

      <section id="position-cards" class="position-cards" aria-live="polite"></section>
    </main>
    <script src="/positions.js" defer></script>
  </body>
</html>
